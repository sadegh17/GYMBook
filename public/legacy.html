<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>برنامه ورزشی ۳۰ دقیقه‌ای | شنبه تا چهارشنبه</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a; --card:#1a2540; --card2:#223052; --line:#2c3a5e;
    --txt:#e8eefc; --muted:#9fb0d0; --acc:#38bdf8; --ok:#22c55e; --warn:#fbbf24;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;
    background:linear-gradient(180deg,var(--bg),#0b1222 60%);
    color:var(--txt); line-height:1.9; min-height:100vh; padding-bottom:92px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:14px}
  header.top{
    background:linear-gradient(135deg,#1e3a8a,#0ea5e9);
    border-radius:0 0 26px 26px; padding:20px 16px 16px; text-align:center;
    box-shadow:0 10px 30px rgba(2,8,23,.55);
  }
  header.top h1{margin:0 0 6px;font-size:19px;font-weight:800}
  header.top p{margin:0;font-size:13px;color:#dbeafe}
  .clockbox{display:inline-flex;gap:6px;align-items:center;margin-top:10px;
    background:rgba(255,255,255,.16);padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700}
  nav.days{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
  nav.days::-webkit-scrollbar{display:none}
  nav.days button{
    flex:0 0 auto;min-width:108px;background:var(--card);color:var(--muted);
    border:1px solid var(--line);border-radius:14px;padding:9px 12px;
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s;line-height:1.7
  }
  nav.days button small{display:block;font-size:11px;font-weight:500;opacity:.85}
  nav.days button.active{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border-color:transparent;
    box-shadow:0 6px 18px rgba(14,165,233,.35)}
  .dayhead{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:6px}
  .dayhead h2{margin:0 0 4px;font-size:17px}
  .dayhead .sub{color:var(--muted);font-size:13px;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--muted)}
  .bar{height:8px;background:#0b1222;border-radius:999px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .3s}
  .barlbl{font-size:11.5px;color:var(--muted);margin-top:6px;display:block}
  .sect{margin:18px 2px 8px;font-size:14px;font-weight:800;color:var(--acc);display:flex;align-items:center;gap:8px}
  .sect::before{content:"";width:6px;height:18px;background:var(--acc);border-radius:4px}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .ex.done{border-color:var(--ok);background:#152a24}
  .ex .row{display:flex;gap:10px;padding:12px;align-items:flex-start}
  .num{flex:0 0 30px;height:30px;border-radius:10px;background:var(--card2);display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--acc)}
  .ex.done .num{background:var(--ok);color:#06281a}
  .meta{flex:1;min-width:0}
  .meta h3{margin:0;font-size:15px;font-weight:800}
  .meta .en{margin:0;font-size:11.5px;color:var(--muted);direction:ltr;text-align:right}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{background:#0b1222;border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:11.5px}
  .tag.g{color:var(--ok);border-color:#1c4532}
  .tag.y{color:var(--warn);border-color:#4a3a10}
  .check{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);
    background:transparent;color:transparent;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ex.done .check{background:var(--ok);border-color:var(--ok);color:#06281a}
  .gifbox{position:relative;margin:0 12px 12px;border-radius:12px;overflow:hidden;background:#fff}
  .gifbox img{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;background:#fff}
  .gifbox .ph{display:none;padding:16px 14px;text-align:center;color:#1f2937;background:#e2e8f0;font-size:12.5px}
  .gifbox.failed img{display:none}
  .gifbox.failed .ph{display:block}
  .gifbox .ph a{color:#1d4ed8;font-weight:700}
  .how{padding:0 12px 12px;font-size:13.5px;color:#d5e3ff}
  .how b{color:var(--warn)}
  .tip{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
  .note{background:#132033;border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;font-size:13px;color:var(--muted);margin-top:18px}
  .note h4{margin:0 0 8px;color:var(--txt);font-size:14px}
  .note ul{margin:0;padding-inline-start:18px}
  .note li{margin-bottom:5px}
  .timerbar{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(15,23,42,.95);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .timerbar .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
  #clock{font-size:21px;font-weight:800;min-width:76px;text-align:center;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:3px 6px;font-variant-numeric:tabular-nums}
  #clock.run{color:var(--ok);border-color:var(--ok)}
  .timerbar button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .timerbar button.main{background:linear-gradient(135deg,#0ea5e9,#2563eb);border-color:transparent}
  .whoBtn{position:absolute;inset-inline-start:12px;top:14px;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .gate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    padding:20px;background:rgba(7,12,26,.92);backdrop-filter:blur(8px)}
  .gate.show{display:flex}
  .gate .box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:24px;padding:22px 18px;text-align:center;box-shadow:0 20px 50px rgba(2,8,23,.6)}
  .gate h2{margin:0 0 4px;font-size:19px}
  .gate p{margin:0 0 18px;font-size:13px;color:var(--muted)}
  .who{display:flex;gap:12px}
  .who button{flex:1;padding:18px 8px;border-radius:18px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-family:inherit;font-size:15px;font-weight:800;
    cursor:pointer;line-height:1.9;transition:.2s}
  .who button small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
  .who button .av{display:block;font-size:30px;margin-bottom:2px}
  .who button[data-p="sadeq"]:hover,.who button[data-p="sadeq"]:focus{border-color:#38bdf8;box-shadow:0 8px 22px rgba(56,189,248,.28)}
  .who button[data-p="saghar"]:hover,.who button[data-p="saghar"]:focus{border-color:#f472b6;box-shadow:0 8px 22px rgba(244,114,182,.28)}
  body[data-profile="saghar"]{--acc:#f472b6;--card:#221a2e;--card2:#2e2340;--line:#463357}
  body[data-profile="saghar"] header.top{background:linear-gradient(135deg,#7e22ce,#ec4899)}
  body[data-profile="saghar"] nav.days button.active{background:linear-gradient(135deg,#ec4899,#a855f7);
    box-shadow:0 6px 18px rgba(236,72,153,.35)}
  body[data-profile="saghar"] .timerbar button.main{background:linear-gradient(135deg,#ec4899,#a855f7)}
  footer{text-align:center;font-size:11.5px;color:var(--muted);padding:14px 0 4px}
  @media (min-width:640px){ .gifbox img{max-height:340px} header.top h1{font-size:22px} }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <h2>کی داره تمرین می‌کنه؟</h2>
    <p>برنامه‌ی مخصوص خودت نمایش داده می‌شود</p>
    <div class="who">
      <button data-p="sadeq"><span class="av">🏋️‍♂️</span>صادق<small>قدرتی • عضله‌سازی</small></button>
      <button data-p="saghar"><span class="av">🤸‍♀️</span>ساغر<small>کراس‌فیت • چربی‌سوزی</small></button>
    </div>
  </div>
</div>
<header class="top">
  <button class="whoBtn" id="btnWho">👤 تغییر کاربر</button>
  <h1 id="hTitle">برنامه تمرین ۳۰ دقیقه‌ای خانگی</h1>
  <p id="hSub">شنبه تا چهارشنبه • شدت ملایم • دو دمبل + بارفیکس</p>
  <div class="clockbox" id="hClock">⏰ ساعت تمرین: ۸:۳۰ تا ۹:۰۰ صبح</div>
</header>
<div class="wrap">
  <nav class="days" id="days"></nav>
  <div class="dayhead">
    <h2 id="dayTitle"></h2>
    <p class="sub" id="daySub"></p>
    <div class="chips" id="dayChips"></div>
    <div class="bar"><i id="barFill"></i></div>
    <span class="barlbl" id="barLabel"></span>
  </div>
  <div id="content"></div>
  <div class="note">
    <h4 id="noteTitle"></h4>
    <ul id="noteList"></ul>
  </div>
  <footer id="footTxt"></footer>
</div>
<div class="timerbar">
  <div class="in">
    <div id="clock">۰۰:۴۵</div>
    <button class="main" id="btnStart">شروع</button>
    <button id="btnReset">ریست</button>
    <button id="btnLen">۴۵ ثانیه</button>
  </div>
</div>

function todayIndex(){
  const map = {6:0, 0:1, 1:2, 2:3, 3:4};
  const d = new Date().getDay();
  return d in map ? map[d] : 0;
}

function stateKey(dayKey){ return "workout_" + dayKey + "_" + new Date().toISOString().slice(0,10); }
function loadState(dayKey){
  try { return JSON.parse(localStorage.getItem(stateKey(dayKey))) || {}; } catch(e){ return {}; }
}
function saveState(dayKey, st){
  try { localStorage.setItem(stateKey(dayKey), JSON.stringify(st)); } catch(e){}
}

      <div class="ph">تصویر متحرک بارگذاری نشد.<br><a href="${ex.page}" target="_blank" rel="noopener">مشاهده حرکت در سایت ↗</a></div>
    </div>
    <div class="how">${ex.how}<p class="tip">نکته: ${ex.tip}</p></div>`;
  const img = div.querySelector("img");
  img.addEventListener("error", () => div.querySelector(".gifbox").classList.add("failed"));
  div.querySelector(".check").addEventListener("click", () => {
    const day = DATA[current];
    const st = loadState(day.key);
    st[id] = !st[id];
    saveState(day.key, st);
    div.classList.toggle("done", !!st[id]);
    updateProgress();
  });
  return div;
}

function updateProgress(){
  const day = DATA[current];
  const st = loadState(day.key);
  const total = day.main.length;
  let done = 0;
  day.main.forEach((_, i) => { if (st["m"+i]) done++; });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("barLabel").textContent =
    `${fa(done)} از ${fa(total)} حرکت اصلی انجام شد (${fa(pct)}٪)`;
}

function render(){
  const day = DATA[current];
  const st = loadState(day.key);

  [...daysEl.children].forEach((b,i) => b.classList.toggle("active", i === current));

  document.getElementById("dayTitle").textContent = day.title;
  document.getElementById("daySub").textContent = day.sub;
  const chips = document.getElementById("dayChips");
  chips.innerHTML = "";
  day.chips.forEach(c => {
    const s = document.createElement("span");
    s.className = "chip"; s.textContent = c; chips.appendChild(s);
  });

  contentEl.innerHTML = "";
  const add = (title, list, prefix) => {
    const h = document.createElement("div");
    h.className = "sect"; h.textContent = title;
    contentEl.appendChild(h);
    list.forEach((ex,i) => contentEl.appendChild(exCard(ex, prefix+i, i+1, !!st[prefix+i])));
  };
  add(PROFILE.sections[0], PROFILE.warm, "w");
  add(PROFILE.sections[1], day.main, "m");
  add(PROFILE.sections[2], PROFILE.cool, "c");
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}

function applyProfile(key){
  profileKey = key;
  PROFILE = PROFILES[key];
  DATA = PROFILE.data;
  document.body.dataset.profile = key;
  try { localStorage.setItem("workout_profile", key); } catch(e){}

  document.getElementById("hTitle").textContent = PROFILE.title;
  document.getElementById("hSub").textContent = PROFILE.sub;
  document.getElementById("hClock").textContent = PROFILE.clock;
  document.getElementById("noteTitle").textContent = PROFILE.noteTitle;
  document.getElementById("footTxt").textContent = PROFILE.foot;
  const nl = document.getElementById("noteList");
  nl.innerHTML = "";
  PROFILE.notes.forEach(t => {
    const li = document.createElement("li");
    li.innerHTML = t; nl.appendChild(li);
  });

  daysEl.innerHTML = "";
  DATA.forEach((d,i) => {
    const b = document.createElement("button");
    b.innerHTML = `${d.day}<small>${d.focus}</small>`;
    b.addEventListener("click", () => { current = i; render(); });
    daysEl.appendChild(b);
  });
  current = todayIndex();
  render();
}

function openGate(){ gateEl.classList.add("show"); }
function closeGate(){ gateEl.classList.remove("show"); }

document.querySelectorAll(".who button").forEach(b => {
  b.addEventListener("click", () => { applyProfile(b.dataset.p); closeGate(); });
});
document.getElementById("btnWho").addEventListener("click", openGate);

let saved = null;
try { saved = localStorage.getItem("workout_profile"); } catch(e){}
if (saved && PROFILES[saved]) { applyProfile(saved); }
else { applyProfile("sadeq"); openGate(); }

let len = 45, left = 45, timer = null;
const clockEl = document.getElementById("clock");
const btnStart = document.getElementById("btnStart");
function paint(){
  const m = String(Math.floor(left/60)).padStart(2,"0");
  const s = String(left%60).padStart(2,"0");
  clockEl.textContent = fa(m + ":" + s);
  clockEl.classList.toggle("run", timer !== null);
}
function stop(){ clearInterval(timer); timer = null; btnStart.textContent = "شروع"; paint(); }
btnStart.addEventListener("click", () => {
  if (timer){ stop(); return; }
  btnStart.textContent = "توقف";
  timer = setInterval(() => {
    left--;
    if (left <= 0){
      left = 0; paint(); stop();
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
      alert("زمان استراحت تمام شد — ست بعدی!");
      left = len; paint();
      return;
    }
    paint();
  }, 1000);
  paint();
});
document.getElementById("btnReset").addEventListener("click", () => { stop(); left = len; paint(); });
document.getElementById("btnLen").addEventListener("click", (e) => {
  len = len === 45 ? 60 : len === 60 ? 30 : 45;
  e.target.textContent = fa(len) + " ثانیه";
  stop(); left = len; paint();
});
paint();
</script>
</body>
